schema_version: 1

context:
  name: reportportal-client
  version: "5.7.8"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: bad64c32c5d1ec118483ac597dfdc4465d220f3775b6fe1f1610f2eedafc1551

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - importlib-metadata
    - pip
    - setuptools >=40.0
    - setuptools-scm
    - wheel
  run:
    - python >=${{ python_min }}
    - typing_extensions >=4.13.2,<=4.16.0
    - requests >=2.32.5,<=2.34.2
    - aiohttp >=3.13.4,<=3.14.1
    - certifi >=2026.2.25,<=2026.7.22

tests:
  - python:
      imports:
        - reportportal_client
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Python client for Report Portal v5.
  license: Apache-2.0
  license_file: LICENSE.md
  homepage: https://github.com/reportportal/client-Python

extra:
  recipe-maintainers:
    - thewchan
